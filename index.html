<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ASCON Trading OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18465C">
<meta name="description" content="ASCON Group — Trading Operating System">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCON">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ASCON app shell (CHG-2026-09-30). Loads the ASCON web app full-screen. */
  :root { --navy: #18465C; --ink: #FFFFFF; --soft: rgba(255,255,255,.72); }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; overflow: hidden; }
  #app { position: fixed; top: env(safe-area-inset-top); left: 0; width: 100%; height: calc(100vh - env(safe-area-inset-top)); height: calc(100dvh - env(safe-area-inset-top)); border: 0; background: #FFFFFF; opacity: 0; transition: opacity .25s; }
  #app.on { opacity: 1; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  .screen img { width: 96px; height: 96px; border-radius: 22px; }
  .screen b { font-size: 18px; letter-spacing: 2px; }
  .screen small { color: var(--soft); font-size: 13px; letter-spacing: 1.5px; }
  .spin { width: 26px; height: 26px; border: 3px solid rgba(255,255,255,.25); border-top-color: #FFFFFF; border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  button { background: #FFFFFF; color: var(--navy); border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid #9CC3D5; outline-offset: 2px; }
  #hint { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5; display: none; align-items: center; gap: 12px; background: #0F3345; color: #FFFFFF; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
  #hint.on { display: flex; }
  #hint p { margin: 0; flex: 1; }
  #hint .x { background: transparent; color: #FFFFFF; padding: 6px 8px; font-size: 18px; }
  #hint .go { padding: 8px 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="screen" id="splash">
    <img src="icon-192.png" alt="ASCON">
    <div><b>ASCON</b><br><small>TRADING OPERATING SYSTEM</small></div>
    <div class="spin" aria-label="Memuat"></div>
  </div>
  <div class="screen" id="offline" hidden>
    <img src="icon-192.png" alt="ASCON">
    <div><b>Tidak ada koneksi</b><br><small>Periksa internet, lalu coba lagi.</small></div>
    <button id="retry">Coba lagi</button>
  </div>
  <iframe id="app" title="ASCON Trading OS" allow="clipboard-write" referrerpolicy="strict-origin"></iframe>
  <div id="hint" role="dialog" aria-live="polite">
    <p id="hintText"></p>
    <button class="go" id="installBtn" hidden>Pasang</button>
    <button class="x" id="hintClose" aria-label="Tutup">✕</button>
  </div>
<script>
  // The ONLY place the web-app address is configured. It stays the same across new versions of the deployment.
  var ASCON_APP_URL = 'https://script.google.com/macros/s/AKfycbyQ-nb4eBWDeLH1CvrGfKQuD0qaMZaSySwFhjpNy9kWH7ncBaaWOv2Ha4SIbDo-h8tYqg/exec';

  var frame = document.getElementById('app'), splash = document.getElementById('splash'), offline = document.getElementById('offline');
  function load() {
    if (!navigator.onLine) { splash.hidden = true; offline.hidden = false; return; }
    offline.hidden = true; splash.hidden = false; frame.classList.remove('on');
    frame.src = ASCON_APP_URL;
  }
  frame.addEventListener('load', function () { if (!frame.src) return; splash.hidden = true; frame.classList.add('on'); });
  document.getElementById('retry').onclick = load;
  window.addEventListener('online', function () { if (!offline.hidden) load(); });
  load();

  // Install hint (only when opened in the browser, not from the home-screen icon)
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var hint = document.getElementById('hint'), hintText = document.getElementById('hintText'), installBtn = document.getElementById('installBtn'), deferred = null;
  var dismissed = false; try { dismissed = localStorage.getItem('ascon_hint_off') === '1'; } catch (e) {}
  function closeHint() { hint.classList.remove('on'); try { localStorage.setItem('ascon_hint_off', '1'); } catch (e) {} }
  document.getElementById('hintClose').onclick = closeHint;
  if (!standalone && !dismissed && ios) {
    hintText.innerHTML = 'Pasang ASCON di iPhone: ketuk <b>Bagikan</b> (kotak dengan panah ↑) lalu <b>Tambah ke Layar Utama</b>.';
    hint.classList.add('on');
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (standalone || dismissed) return;
    hintText.textContent = 'Pasang ASCON sebagai aplikasi di HP ini.';
    installBtn.hidden = false; hint.classList.add('on');
  });
  installBtn.onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; closeHint(); });
  };
  window.addEventListener('appinstalled', closeHint);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
